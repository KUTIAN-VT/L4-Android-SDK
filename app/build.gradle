plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionTime = new Date().format("yyyy-MM-dd-HH-mm")

android {
    namespace 'com.coolfly.demo'
    compileSdk 36

    defaultConfig {
        applicationId "com.coolfly.demo"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "1.19.0"
        buildConfigField "String", "COMPILE_TIME", "\"$versionTime\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters /*"armeabi-v7a", */"arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def fileName = "app.apk"
            if (variant.buildType.name == 'release') {
                fileName = "app-release-" + versionTime + ".apk"
            } else if (variant.buildType.name == 'debug') {
                fileName = "app-debug-" + versionTime + ".apk"
            }
            outputFileName = fileName
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation project(path: ':fflibrary')
    implementation project(path: ':cflibrary')
    implementation project(path: ':aoalibrary')
    implementation project(path: ':medialibrary')
    implementation project(path: ':loglibrary')

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.licheedev:android-serialport:2.1.5'
    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.github.hzw1199:FloatingView:1.8.0'

    // For saving log to files.
    // If you do not want to show logs produced by SDK, just remove dependency of loglibrary.aar and following dependencies.
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'com.github.tony19:logback-android:1.1.1-12'

    // MQTT dependencies
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.github.hannesa2:paho.mqtt.android:4.4.1'
}