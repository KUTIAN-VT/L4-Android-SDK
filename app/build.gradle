plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coolfly.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.coolfly.demo"
        minSdk 23
        targetSdk 33
        versionCode 19
        versionName "1.19.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(path: ':fflibrary')
    implementation project(path: ':cflibrary')
    implementation project(path: ':aoalibrary')
    implementation project(path: ':medialibrary')

    implementation 'com.alibaba:fastjson:1.2.79'
    implementation 'com.licheedev:android-serialport:2.1.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.blankj:utilcodex:1.31.1'
}