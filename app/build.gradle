plugins {
    id 'com.android.application'
}

def versionTime = new Date().format("yyyy-MM-dd-HH-mm")

android {
    namespace 'com.coolfly.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.coolfly.demo"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "1.19.0"
        buildConfigField "String", "COMPILE_TIME", "\"$versionTime\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters /*"armeabi-v7a", */"arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def fileName = "app.apk"
            if (variant.buildType.name == 'release') {
                fileName = "app-release-" + versionTime + ".apk"
            } else if (variant.buildType.name == 'debug') {
                fileName = "app-debug-" + versionTime + ".apk"
            }
            outputFileName = fileName
        }
    }
}
configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation project(path: ':fflibrary')
    implementation project(path: ':cflibrary')
    implementation project(path: ':aoalibrary')
    implementation project(path: ':medialibrary')

    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.licheedev:android-serialport:2.1.3'
    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.blankj:utilcodex:1.31.1'
}